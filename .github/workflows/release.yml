name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump type (auto = infer from commit message [major]/[minor])"
        required: false
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          bump="patch"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            bump="${{ inputs.bump }}"
            [[ "$bump" == "" || "$bump" == "auto" ]] && bump="patch"
          else
            msg=$(git log -1 --pretty=%B)
            case "$msg" in
              *"[major]"*) bump="major" ;;
              *"[minor]"*) bump="minor" ;;
            esac
          fi

          max_major=0; max_minor=0; max_patch=0
          git tag --list 'v*' > /tmp/nbls_vtags.txt || true
          while IFS= read -r t; do
            [[ "$t" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || continue
            mj=${BASH_REMATCH[1]}; mn=${BASH_REMATCH[2]}; pt=${BASH_REMATCH[3]}
            if (( 10#$mj > 10#$max_major )) \
              || { (( 10#$mj == 10#$max_major )) && { (( 10#$mn > 10#$max_minor )) || { (( 10#$mn == 10#$max_minor )) && (( 10#$pt > 10#$max_patch )); }; }; }; then
              max_major=$mj; max_minor=$mn; max_patch=$pt
            fi
          done < /tmp/nbls_vtags.txt

          if [[ "$max_major$max_minor$max_patch" == "000" ]]; then
            nv="1.0.0"
          else
            while :; do
              case "$bump" in
                major) nv="$((max_major + 1)).0.0" ;;
                minor) nv="$max_major.$((max_minor + 1)).0" ;;
                *)     nv="$max_major.$max_minor.$((max_patch + 1))" ;;
              esac
              IFS=. read -r cmj cmn cpt <<< "$nv"
              if ! git rev-parse -q --verify "refs/tags/v$nv" >/dev/null 2>&1; then break; fi
              max_major=$cmj; max_minor=$cmn; max_patch=$cpt; bump="patch"
            done
          fi

          echo "Next version: v$nv (bump=$bump)"
          echo "version=$nv" >> "$GITHUB_OUTPUT"
          echo "tag=v$nv"    >> "$GITHUB_OUTPUT"

      - name: Build x86 & x64 (nb_build_gui.py toolchain)
        shell: pwsh
        run: |
          & "${{ github.workspace }}\build_ci.ps1" -Version "${{ steps.version.outputs.version }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: exe-${{ steps.version.outputs.version }}-${{ github.run_number }}
          path: |
            dist/x86/NB_LANShare_x86.exe
            dist/x64/NB_LANShare_x64.exe

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: NB_LANShare v${{ steps.version.outputs.version }}
          body: |
            **自动构建发布 (Automated Release)**

            - Commit: `${{ github.sha }}`
            - Version: `${{ steps.version.outputs.version }}`
            - x86 (WinXP Subsystem 5.01): `NB_LANShare_x86.exe`
            - x64 (WinXP Subsystem 5.02): `NB_LANShare_x64.exe`

            版本号自动递增规则：提交信息含 `[major]` / `[minor]` 分别提升主/次版本号，否则递增补丁号。
          files: |
            dist/x86/NB_LANShare_x86.exe
            dist/x64/NB_LANShare_x64.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}